<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620"><rect width="1160" height="620" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#324c58"/></marker></defs><style>text{font-family:Arial;fill:#243e4c}</style><text x="35" y="35" font-size="20">COMMON ADAPTER / MOUNTING REFERENCE</text><rect x="70" y="90" width="180" height="260" fill="#d8e4e9" stroke="#344955"/><circle cx="82" cy="104" r="2.5" fill="white" stroke="#344955"/><circle cx="82" cy="336" r="2.5" fill="white" stroke="#344955"/><circle cx="238" cy="104" r="2.5" fill="white" stroke="#344955"/><circle cx="238" cy="336" r="2.5" fill="white" stroke="#344955"/><path d="M70 380L250 380" stroke="#324c58" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="160" y="373" text-anchor="middle" font-size="12">180 mm</text><path d="M82 72L238 72" stroke="#324c58" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="160" y="65" text-anchor="middle" font-size="12">156 mm centres</text><text x="75" y="411" font-size="13">260 mm high / 4 mm thick</text><text x="75" y="435" font-size="13">4 × Ø5 clearance / 232 mm vertical pitch</text><rect x="340" y="85" width="370" height="180" rx="12" fill="#f0f6f7"/><text x="360" y="118" font-size="18">Partition clamp</text><text x="360" y="161" font-size="13">12–50 mm panel range; 50 mm shown</text><text x="360" y="190" font-size="12">Two padded jaws; edge access required</text><text x="360" y="232" font-size="12">Prototype geometry / proof testing required</text><rect x="745" y="85" width="370" height="180" rx="12" fill="#f0f6f7"/><text x="765" y="118" font-size="18">Rail clamp</text><text x="765" y="161" font-size="13">32 mm insert shown; split halves</text><text x="765" y="190" font-size="12">25 / 38 mm inserts require separate parts</text><text x="765" y="232" font-size="12">Prototype geometry / proof testing required</text><rect x="340" y="305" width="370" height="180" rx="12" fill="#f0f6f7"/><text x="360" y="338" font-size="18">Over-partition hook</text><text x="360" y="381" font-size="13">55 mm nominal padded gap</text><text x="360" y="410" font-size="12">Check anti-lift restraint and top clearance</text><text x="360" y="452" font-size="12">Prototype geometry / proof testing required</text><rect x="745" y="305" width="370" height="180" rx="12" fill="#f0f6f7"/><text x="765" y="338" font-size="18">Pedestal</text><text x="765" y="381" font-size="13">500 × 500 × 30 mm ballast envelope</text><text x="765" y="410" font-size="12">60 kg base; stability limitations documented</text><text x="765" y="452" font-size="12">Prototype geometry / proof testing required</text><text x="70" y="565" font-size="13">Smooth-surface and magnetic mounting remain conditional on qualified products, substrate and independent tether.</text></svg>